<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician DM - Painel Profissional de RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-grid">
        
        <!-- COLUNA 1: ADICIONAR & STATUS DO SISTEMA -->
        <aside class="sidebar-painel">
            <div class="card">
                <h3>+ Novo Combatente</h3>
                <div class="form-grupo">
                    <div class="input-field">
                        <input type="text" id="nome" required placeholder=" ">
                        <label>Nome do Personagem</label>
                    </div>
                    <div class="input-row">
                        <div class="input-field">
                            <input type="number" id="iniciativa" required placeholder=" ">
                            <label>Iniciativa</label>
                        </div>
                        <div class="input-field">
                            <input type="number" id="hp" required placeholder=" ">
                            <label>HP Máximo</label>
                        </div>
                    </div>
                    <button id="btnAdicionar" class="btn-primary">Inserir na Mesa</button>
                </div>
            </div>

            <!-- CARD DE NOTAS RÁPIDAS DO MESTRE -->
            <div class="card fixed-card">
                <h3>Notas do Cenário</h3>
                <textarea id="notasMestre" placeholder="Pistas, segredos, nomes de NPCs reservas... (Salva automaticamente)"></textarea>
            </div>
        </aside>

        <!-- COLUNA 2: CENTRAL DO COMBATE (TRACKER) -->
        <main class="main-content">
            <header class="main-header">
                <h2>Ordem de Iniciativa Ativa</h2>
                <div class="controles-sessao">
                    <button onclick="limparMesa()" class="btn-danger-outline">Resetar Combate</button>
                </div>
            </header>
            
            <div id="listaCombate" class="lista-combate">
                <!-- Cards Dinâmicos -->
            </div>
        </main>

        <!-- COLUNA 3: CONTROLE DE AMBIENTAÇÃO (SOUNDBOARD) -->
        <section class="soundboard-painel">
            <div class="card">
                <h3>Clima & Iluminação</h3>
                <div class="grid-botoes">
                    <button class="btn-clima" onclick="mudarClima('chuva')">🌧️ Chuva</button>
                    <button class="btn-clima" onclick="mudarClima('caverna')">⛰️ Caverna</button>
                    <button class="btn-clima" onclick="mudarClima('fogo')">🔥 Inferno/Fogo</button>
                    <button class="btn-clima limpo" onclick="mudarClima('limpo')">☀️ Parar Efeitos</button>
                </div>
            </div>

            <div class="card">
                <h3>Efeitos Sonoros Rápidos</h3>
                <div class="grid-botoes">
                    <button class="btn-sound" onclick="tocarSom('espada')">⚔️ Ataque Espada</button>
                    <button class="btn-sound" onclick="tocarSom('magia')">🔮 Feitiço/Magia</button>
                    <button class="btn-sound" onclick="tocarSom('monstro')">👹 Rugido</button>
                    <button class="btn-sound" onclick="tocarSom('moedas')">🪙 Ouro/Tesouro</button>
                </div>
            </div>
        </section>

    </div>

    <!-- Tags de áudio ocultas para controle de efeitos e loops ambiente -->
    <audio id="audio-chuva" loop src="https://assets.mixkit.co/active_storage/sfx/2448/2448-84.wav"></audio>
    <audio id="audio-caverna" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"></audio> <!-- Exemplo de trilha gótica de fundo -->
    
    <!-- Efeitos sonoros isolados -->
    <audio id="audio-espada" src="https://assets.mixkit.co/active_storage/sfx/2809/2809-84.wav"></audio>
    <audio id="audio-magia" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav"></audio>
    <audio id="audio-monstro" src="https://assets.mixkit.co/active_storage/sfx/2323/2323-84.wav"></audio>
    <audio id="audio-moedas" src="https://assets.mixkit.co/active_storage/sfx/1733/1733-84.wav"></audio>

    <script src="app.js"></script>
</body>
</html>
